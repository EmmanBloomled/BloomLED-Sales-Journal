<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloomLED Learning Journal</title>

<!--
  ============================================================================
  BLOOMLED TEAM LEARNING JOURNAL
  ============================================================================
  A shared knowledge base for the BloomLED sales & ops team. Every site visit,
  client call, quotation, and installation teaches something — this app is
  where that gets written down so it isn't lost.

  SETUP INSTRUCTIONS ARE AT THE VERY BOTTOM OF THIS FILE (after </html>,
  in a comment block) AND ALSO PRINTED IN THE README SENT ALONGSIDE THIS FILE.
  Read them before sharing this file with the team.

  Quick orientation for anyone editing this file later:
  - All styling is in the <style> block below.
  - All app logic is vanilla JavaScript in the <script> block at the bottom.
  - Supabase is used as the shared database. Until you add real credentials
    (see SUPABASE CONFIG below), the app runs in DEMO MODE with sample data
    kept only in memory (nothing is saved, and nothing is shared between
    people) so you can see how everything looks and works right away.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Creato Display is a paid/licensed font and can't be embedded on a public site without a license.
     Plus Jakarta Sans is the closest freely-licensed match: same geometric, rounded-terminal character. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     DESIGN TOKENS
     Palette is built around BloomLED's two worlds: "bloom" (growth, plants,
     the company name) and "LED module grid" (the product itself). Foliage
     green + warm signal-amber, on a cool paper background — not the default
     terracotta/cream or dark-mode-neon combos.
     ========================================================================== */
  :root {
    /* BloomLED brand palette, sampled directly from the company logo and
       brochure: deep indigo-purple, teal, and magenta/violet accents. */
    --paper: #FAFAFC;
    --surface: #FFFFFF;
    --ink: #2A2740;
    --ink-soft: #55506B;
    --muted: #8A8496;
    --line: #E6E3F0;
    --bloom: #52489D;
    --bloom-deep: #3B3272;
    --bloom-tint: #EEECF9;
    --signal: #C6549F;
    --signal-tint: #F7E9F1;
    --danger: #B4483A;
    --danger-tint: #F7E9E6;
    --teal: #3E8F86;
    --hero-start: #4A479B;
    --hero-end: #6E8F92;

    --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

    --radius-s: 6px;
    --radius-m: 10px;
    --shadow-hover: 0 6px 20px rgba(27, 36, 32, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

  /* --------------------------------------------------------------------------
     APP SHELL
     -------------------------------------------------------------------------- */
  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    min-height: 100vh;
  }

  /* Left rail navigation (desktop) */
  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .rail-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 6px 26px 6px;
  }

  .rail-brand .mark {
    width: 30px; height: 30px;
    flex-shrink: 0;
  }
  .rail-brand .mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .rail-brand .name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16.5px;
    letter-spacing: 0.01em;
    line-height: 1.15;
    color: var(--bloom-deep);
  }
  .rail-brand .name small {
    display: block;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .rail-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }

  .rail-link {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 10px;
    border-radius: var(--radius-s);
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
  }
  .rail-link svg { width: 18px; height: 18px; flex-shrink: 0; }
  .rail-link:hover { background: var(--paper); color: var(--ink); }
  .rail-link.active { background: var(--bloom-tint); color: var(--bloom-deep); font-weight: 600; }

  .rail-foot {
    margin-top: auto;
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 6px 0 6px;
    border-top: 1px solid var(--line);
  }
  .rail-foot .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; position: relative; top: -1px;
  }
  .rail-foot .dot.live { background: var(--bloom); }
  .rail-foot .dot.demo { background: var(--signal); }

  .admin-toggle {
    display: inline-block;
    margin-top: 8px;
    background: none;
    border: none;
    padding: 0;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }
  .admin-toggle:hover { color: var(--ink-soft); text-decoration: underline; }
  .admin-toggle.admin-on { color: var(--bloom-deep); }

  /* Mobile bottom tab bar */
  .tabbar {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    z-index: 50;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar-row { display: flex; justify-content: space-around; }
  .tabbar .rail-link { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 4px; text-align: center; }
  .tabbar .rail-link svg { width: 20px; height: 20px; }

  main.view { padding: 34px 40px 60px; max-width: 980px; }

  @media (max-width: 880px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .tabbar { display: block; }
    main.view { padding: 22px 16px 90px; }
  }

  /* --------------------------------------------------------------------------
     SHARED PATTERNS
     -------------------------------------------------------------------------- */
  .page-head { margin-bottom: 26px; }
  .page-head h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .page-head p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 60ch; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 16px;
    border-radius: var(--radius-s);
    border: 1px solid transparent;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--bloom); color: #fff; }
  .btn-primary:hover { background: var(--bloom-deep); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }
  .btn-danger { background: transparent; border-color: var(--danger-tint); color: var(--danger); }
  .btn-danger:hover { background: var(--danger-tint); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
  }

  .pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    background: var(--bloom-tint);
    color: var(--bloom-deep);
    white-space: nowrap;
  }
  .pill.tag { background: var(--paper); color: var(--ink-soft); font-weight: 500; border: 1px solid var(--line); }
  .pill.setting { background: var(--signal-tint); color: #8A3E68; }

  .toast {
    position: fixed;
    bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: #fff;
    padding: 11px 18px;
    border-radius: var(--radius-s);
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

  /* --------------------------------------------------------------------------
     DASHBOARD
     -------------------------------------------------------------------------- */
  .hero {
    background: linear-gradient(135deg, var(--hero-start) 0%, var(--hero-end) 100%);
    border-radius: 16px;
    padding: 34px 32px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    overflow: hidden;
    position: relative;
  }
  .hero-text h2 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 8px;
    max-width: 20ch;
  }
  .hero-text p { margin: 0 0 18px; color: #E2E0F2; font-size: 14px; max-width: 40ch; }
  .hero .btn-primary { background: var(--signal); color: #fff; }
  .hero .btn-primary:hover { background: #A83E82; }

  .pixel-grid { display: grid; grid-template-columns: repeat(8, 12px); grid-template-rows: repeat(6, 12px); gap: 4px; flex-shrink: 0; }
  .pixel-grid i { display: block; width: 12px; height: 12px; border-radius: 2px; background: rgba(255,255,255,0.08); }
  .pixel-grid i.on { background: var(--signal); animation: flicker-in 0.5s ease both; }
  @keyframes flicker-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 30px;
  }
  @media (max-width: 780px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

  .stat {
    padding: 16px 16px 14px;
  }
  .stat .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    color: var(--bloom-deep);
  }
  .stat .label { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-weight: 500; }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 6px 0 14px;
  }
  .section-title h3 { font-size: 15px; margin: 0; font-weight: 600; }
  .section-title a.see-all { font-size: 13px; color: var(--bloom-deep); font-weight: 600; text-decoration: none; }

  /* --------------------------------------------------------------------------
     JOURNAL FEED + ENTRY CARDS
     -------------------------------------------------------------------------- */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; align-items: center;
  }
  .toolbar input[type=text], .toolbar select {
    font-family: inherit; font-size: 13.5px;
    padding: 9px 12px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .toolbar .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .toolbar .search-wrap input { width: 100%; padding-left: 34px; }
  .toolbar .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .toolbar select { min-width: 130px; }
  .toolbar .clear-filters { font-size: 12.5px; color: var(--muted); background: none; border: none; text-decoration: underline; padding: 4px; }

  .feed { display: flex; flex-direction: column; gap: 12px; }

  .entry {
    display: flex;
    border-left: 4px solid var(--topic-color, var(--bloom));
    border-radius: var(--radius-m);
    overflow: hidden;
    transition: box-shadow 0.15s ease;
  }
  .entry:hover { box-shadow: var(--shadow-hover); }
  .entry-body { padding: 16px 18px; flex: 1; }

  .entry-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .entry-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0 0 5px; cursor: pointer; }
  .entry-title:hover { text-decoration: underline; text-decoration-color: var(--line); }
  .entry-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 10px; }
  .entry-meta .sep { color: var(--line); }

  .entry-key { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; }
  .entry-topics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }

  .entry-detail {
    display: none;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--ink-soft);
  }
  .entry-detail.open { display: block; }
  .entry-detail .field { margin-bottom: 12px; }
  .entry-detail .field-label { font-weight: 600; color: var(--ink); font-size: 12.5px; margin-bottom: 3px; }

  .entry-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .reaction-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--line);
    padding: 6px 11px; border-radius: 100px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  }
  .reaction-btn:hover { border-color: var(--bloom); color: var(--bloom-deep); }
  .reaction-btn.active { background: var(--bloom-tint); border-color: var(--bloom); color: var(--bloom-deep); }

  .comments { margin-top: 16px; }
  .comment { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .comment .c-head { font-weight: 600; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
  .comment .c-head span { font-weight: 500; color: var(--muted); margin-left: 6px; }
  .comment-del { margin-left: auto; background: none; border: none; padding: 0; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .comment-del:hover { color: var(--danger); text-decoration: underline; }
  .comment-form { display: flex; gap: 8px; margin-top: 10px; }
  .comment-form input { flex: 1; font-family: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: var(--radius-s); border: 1px solid var(--line); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .glyph { font-size: 32px; margin-bottom: 10px; }
  .empty-state h4 { font-family: var(--font-display); font-size: 18px; color: var(--ink); margin: 0 0 6px; }

  /* --------------------------------------------------------------------------
     ADD LEARNING FORM
     -------------------------------------------------------------------------- */
  .form-card { padding: 28px 30px 30px; max-width: 700px; }
  .form-row { margin-bottom: 20px; }
  .form-row label {
    display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--ink);
  }
  .form-row .hint { font-weight: 500; color: var(--muted); font-size: 12px; }
  .form-row input[type=text], .form-row input[type=date], .form-row select, .form-row textarea {
    width: 100%; font-family: inherit; font-size: 14px;
    padding: 10px 12px; border-radius: var(--radius-s);
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--bloom); background: #fff;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }

  .chip-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 13px; border-radius: 100px; border: 1px solid var(--line);
    background: var(--paper); font-size: 13px; font-weight: 500; color: var(--ink-soft);
  }
  .chip.selected { background: var(--bloom); border-color: var(--bloom); color: #fff; }
  .chip.add-new { background: transparent; border-style: dashed; color: var(--muted); }

  .form-foot { display: flex; gap: 10px; margin-top: 26px; align-items: center; }
  .form-msg { font-size: 13px; color: var(--bloom-deep); font-weight: 600; }

  /* --------------------------------------------------------------------------
     TOPICS LIBRARY
     -------------------------------------------------------------------------- */
  .topic-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;
    margin-bottom: 30px;
  }
  .topic-tile {
    padding: 18px; text-align: left; border-top: 3px solid var(--topic-color, var(--bloom));
  }
  .topic-tile:hover { box-shadow: var(--shadow-hover); }
  .topic-tile .t-name { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; margin-bottom: 4px; }
  .topic-tile .t-count { font-size: 12.5px; color: var(--muted); }

  .topic-detail-list { display: flex; flex-direction: column; gap: 10px; }
  .topic-detail-item {
    padding: 13px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  .topic-detail-item .ti-title { font-weight: 600; font-size: 14px; cursor: pointer; }
  .topic-detail-item .ti-title:hover { text-decoration: underline; }
  .topic-detail-item .ti-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .back-link { font-size: 13px; color: var(--bloom-deep); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 18px; background: none; border: none; padding: 0; }

  /* --------------------------------------------------------------------------
     INSIGHTS
     -------------------------------------------------------------------------- */
  .insight-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-bottom: 20px; }
  @media (max-width: 780px) { .insight-grid { grid-template-columns: 1fr; } }
  .insight-card { padding: 22px 24px; }
  .insight-card h4 { font-family: var(--font-display); font-size: 15.5px; margin: 0 0 16px; font-weight: 700; }

  .bar-row { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .b-label { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--paper); border-radius: 6px; height: 9px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bloom); border-radius: 6px; }
  .bar-row .b-num { font-size: 12px; color: var(--muted); text-align: right; }

  .leader-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .leader-row:first-child { border-top: none; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--bloom-tint); color: var(--bloom-deep);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; flex-shrink: 0;
  }
  .leader-row .l-name { font-size: 13.5px; font-weight: 600; flex: 1; }
  .leader-row .l-count { font-size: 12.5px; color: var(--muted); }

  /* Modal (edit) */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(27,36,32,0.4);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: var(--radius-m); max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 26px 28px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-head h3 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); line-height: 1; padding: 4px; }
</style>
</head>
<body>

<div class="app">
  <!-- ============================ LEFT NAV (desktop) ============================ -->

/* ============================================================================
   DATA LAYER — abstracts over Supabase vs. in-memory demo mode so the rest
   of the app never needs to know which one it's talking to.
   ============================================================================ */
const Data = {
  async loadAll() {
    if (DEMO_MODE) {
      if (state.entries.length === 0) seedDemoData();
      return;
    }
    const { data: learnings, error } = await supabaseClient
      .from("learnings").select("*").order("created_at", { ascending: false });
    if (error) { console.error(error); showToast("Couldn't load entries — check Supabase config."); return; }

    const { data: comments } = await supabaseClient.from("comments").select("*").order("created_at", { ascending: true });

    state.entries = (learnings || []).map(l => ({
      ...l,
      topics: l.topics || [],
      tags: l.tags || [],
      comments: (comments || []).filter(c => c.learning_id === l.id)
    }));
  },

  async add(entry) {
    if (DEMO_MODE) {
      const newEntry = { ...entry, id: "demo-" + Date.now(), likes: 0, insights: 0, created_at: new Date().toISOString(), comments: [] };
      state.entries.unshift(newEntry);
      return newEntry;
    }
    const { data, error } = await supabaseClient.from("learnings").insert([entry]).select();
    if (error) { console.error(error); showToast("Couldn't save — check Supabase config."); return null; }
    const newEntry = { ...data[0], comments: [] };
    state.entries.unshift(newEntry);
    return newEntry;
  },

  async update(id, fields) {
    const local = state.entries.find(e => e.id === id);
    if (DEMO_MODE) {
      Object.assign(local, fields);
      return;
    }
    const { error } = await supabaseClient.from("learnings").update(fields).eq("id", id);
    if (error) { console.error(error); showToast("Couldn't update — check Supabase config."); return; }
    Object.assign(local, fields);
  },

  async remove(id) {
    if (!DEMO_MODE) {
      const { error } = await supabaseClient.from("learnings").delete().eq("id", id);
      if (error) { console.error(error); showToast("Couldn't delete — check Supabase config."); return; }
    }
    state.entries = state.entries.filter(e => e.id !== id);
  },

  async addComment(learningId, author, comment) {
    const entry = state.entries.find(e => e.id === learningId);
    if (DEMO_MODE) {
      const newComment = { id: "c-" + Date.now(), author, comment, created_at: new Date().toISOString() };
      entry.comments.push(newComment);
      return;
    }
    const { data, error } = await supabaseClient.from("comments").insert([{ learning_id: learningId, author, comment }]).select();
    if (error) { console.error(error); showToast("Couldn't post comment — check Supabase config."); return; }
    entry.comments.push(data[0]);
  },

  async deleteComment(learningId, commentId) {
    const entry = state.entries.find(e => e.id === learningId);
    if (!DEMO_MODE) {
      const { error } = await supabaseClient.from("comments").delete().eq("id", commentId);
      if (error) { console.error(error); showToast("Couldn't remove comment — check Supabase config."); return; }
    }
    entry.comments = entry.comments.filter(c => c.id !== commentId);
  }
};

/* A tiny two-note "thank you" chime, played only right after someone
   successfully submits a learning. Built with the Web Audio API so no
   external sound file is needed — keeps this a single, self-contained file.
   Browsers require a user gesture (like clicking "Save learning") before
   audio can play, which a form submit naturally satisfies. */
function playThankYouChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25]; // a friendly little C5 -> E5 lift
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.14;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) {
    // Some browsers block audio without an obvious user gesture — fail silently.
  }
}

function fmtDate(dateStr) {
  const d = new Date(dateStr + (dateStr.length <= 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" });
}

function initials(name) {
  return name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}

function isThisWeek(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  start.setHours(0,0,0,0);
  return d >= start;
}
function isThisMonth(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function filteredEntries() {
  const f = state.filters;
  return state.entries.filter(e => {
    if (f.topic && !e.topics.includes(f.topic)) return false;
    if (f.author && e.author !== f.author) return false;
    if (f.setting && e.work_setting !== f.setting) return false;
    if (f.tag && !(e.tags || []).some(t => t.toLowerCase() === f.tag.toLowerCase())) return false;
    if (f.q) {
      const hay = [e.title, e.key_learning, e.experience, e.author, ...(e.tags||[])].join(" ").toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
}

function uniqueAuthors() {
  return [...new Set(state.entries.map(e => e.author))].sort();
}

   --------------------------------------------------------------------------- */
function renderDashboard() {
  const total = state.entries.length;
  const week = state.entries.filter(e => isThisWeek(e.entry_date)).length;
  const month = state.entries.filter(e => isThisMonth(e.entry_date)).length;

  const topicCounts = {};
  state.entries.forEach(e => e.topics.forEach(t => topicCounts[t] = (topicCounts[t]||0)+1));
  const topTopic = Object.entries(topicCounts).sort((a,b)=>b[1]-a[1])[0];

  const authorCounts = {};
  state.entries.forEach(e => authorCounts[e.author] = (authorCounts[e.author]||0)+1);
  const contributors = Object.keys(authorCounts).length;

  // Pixel grid: light up a number of cells proportional to total entries (capped)
  const totalCells = 48;
  const lit = Math.min(totalCells, total * 3);
  let cells = "";
  for (let i = 0; i < totalCells; i++) {
    cells += `<i class="${i < lit ? 'on' : ''}" style="${i < lit ? `animation-delay:${i*18}ms` : ''}"></i>`;
  }

  const recent = state.entries.slice(0, 4);

  return `
    <div class="hero">
      <div class="hero-text">
        <h2>What did the team learn today?</h2>
        <p>Every ocular, call, and negotiation teaches something. Write it down before it's forgotten.</p>
        <button class="btn btn-primary" onclick="navigate('add')">${ICONS.add}Add a learning</button>
      </div>
      <div class="pixel-grid">${cells}</div>
    </div>

    <div class="stat-row">
      <div class="card stat"><div class="num">${total}</div><div class="label">Total learnings</div></div>
      <div class="card stat"><div class="num">${week}</div><div class="label">This week</div></div>
      <div class="card stat"><div class="num">${month}</div><div class="label">This month</div></div>
      <div class="card stat"><div class="num" style="font-size:19px; line-height:1.25; padding-top:2px;">${topTopic ? escapeHtml(topTopic[0]) : "—"}</div><div class="label">Most active topic</div></div>
      <div class="card stat"><div class="num">${contributors}</div><div class="label">Contributors</div></div>
    </div>

    <div class="section-title"><h3>Recent learnings</h3><a class="see-all" href="#" onclick="navigate('journal');return false;">See all →</a></div>
    <div class="feed">
      ${recent.length ? recent.map(e => entryCard(e, false)).join("") : emptyState("No learnings yet", "Be the first to add one.")}
    </div>
  `;
}

function setupChipPickers() {
  const picker = document.getElementById("topicPicker");
  if (!picker) return;
  picker.querySelectorAll(".chip[data-topic]").forEach(chip => {
    chip.addEventListener("click", () => chip.classList.toggle("selected"));
  });
  document.getElementById("addTopicChip").addEventListener("click", () => {
    const name = prompt("New topic name:");
    if (!name || !name.trim()) return;
    const clean = name.trim();
    if (!state.customTopics.includes(clean) && !DEFAULT_TOPICS.includes(clean)) state.customTopics.push(clean);
    render();
    // Re-select the newly added chip after re-render
    setTimeout(() => {
      const newChip = document.querySelector(`.chip[data-topic="${CSS.escape(clean)}"]`);
      if (newChip) newChip.classList.add("selected");
    }, 0);
  });
}

    key_learning: document.getElementById("e_key").value.trim(),
    experience: document.getElementById("e_experience").value.trim(),
    what_worked: document.getElementById("e_worked").value.trim(),
    what_improve: document.getElementById("e_improve").value.trim(),
    next_time: document.getElementById("e_next").value.trim(),
    tags: document.getElementById("e_tags").value.split(",").map(t=>t.trim()).filter(Boolean)
  });
  closeEditModal();
  showToast("Changes saved");
  render();
}

/* ---------------------------------------------------------------------------
   TOPICS LIBRARY
   --------------------------------------------------------------------------- */
function renderTopics() {
  const topics = getAllTopics();
  const counts = {};
  state.entries.forEach(e => e.topics.forEach(t => counts[t] = (counts[t]||0)+1));

  return `
    <div class="page-head">
      <h1>Topics library</h1>
      <p>The journal, organized as a knowledge base rather than a diary. Click a topic to browse everything filed under it.</p>
    </div>
    <div class="topic-grid">
      ${topics.map(t => `
        <button class="card topic-tile" style="--topic-color:${topicColor(t)}" onclick="navigate('topicDetail','${escapeHtml(t)}')">
          <div class="t-name">${escapeHtml(t)}</div>
          <div class="t-count">${counts[t]||0} learning${counts[t]===1?"":"s"}</div>
        </button>
      `).join("")}
    </div>
  `;
}

function renderTopicDetail() {
  const topic = state.activeTopicDetail;
  const items = state.entries.filter(e => e.topics.includes(topic)).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  return `
    <button class="back-link" onclick="navigate('topics')">${ICONS.back} All topics</button>
    <div class="page-head">
      <h1 style="display:flex;align-items:center;gap:10px;"><span style="width:12px;height:12px;border-radius:3px;background:${topicColor(topic)};display:inline-block;"></span>${escapeHtml(topic)}</h1>
      <p>${items.length} learning${items.length===1?"":"s"} filed under this topic.</p>
    </div>
    <div class="topic-detail-list">
      ${items.length ? items.map(e => `
        <div class="card topic-detail-item">
          <div>
            <div class="ti-title" onclick="navigate('journal'); setFilter('topic','${escapeHtml(topic)}');">${escapeHtml(e.title)}</div>
            <div class="ti-meta">${escapeHtml(e.author)} · ${fmtDate(e.entry_date)}</div>
          </div>
          <span class="pill setting">${escapeHtml(e.work_setting)}</span>
        </div>
      `).join("") : emptyState("Nothing here yet", "Entries tagged with this topic will show up here.")}
    </div>
  `;
}

/* ---------------------------------------------------------------------------
   INSIGHTS
   --------------------------------------------------------------------------- */
function renderInsights() {
  const topicCounts = {};
  state.entries.forEach(e => e.topics.forEach(t => topicCounts[t] = (topicCounts[t]||0)+1));
  const topTopics = Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxTopicCount = Math.max(1, ...topTopics.map(t=>t[1]));

  const authorCounts = {};
  state.entries.forEach(e => authorCounts[e.author] = (authorCounts[e.author]||0)+1);
  const topAuthors = Object.entries(authorCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const settingCounts = {};
  state.entries.forEach(e => settingCounts[e.work_setting] = (settingCounts[e.work_setting]||0)+1);
  const maxSettingCount = Math.max(1, ...Object.values(settingCounts));

  return `
    <div class="page-head">
      <h1>Insights</h1>
      <p>Where the team's learnings are concentrated — useful for spotting patterns and Playbook candidates.</p>
    </div>

    <div class="insight-grid">
      <div class="card insight-card">
        <h4>Learnings by topic</h4>
        ${topTopics.length ? topTopics.map(([t,c]) => `
          <div class="bar-row">
            <div class="b-label">${escapeHtml(t)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(c/maxTopicCount)*100}%; background:${topicColor(t)}"></div></div>
            <div class="b-num">${c}</div>
          </div>
        `).join("") : `<p style="color:var(--muted); font-size:13.5px;">No entries yet.</p>`}
      </div>

      <div class="card insight-card">
        <h4>Most active contributors</h4>
        ${topAuthors.length ? topAuthors.map(([a,c]) => `
          <div class="leader-row">
            <div class="avatar">${initials(a)}</div>
            <div class="l-name">${escapeHtml(a)}</div>
            <div class="l-count">${c} entr${c===1?"y":"ies"}</div>
          </div>
        `).join("") : `<p style="color:var(--muted); font-size:13.5px;">No entries yet.</p>`}
      </div>
    </div>

    <div class="card insight-card">
      <h4>Learnings by work setting</h4>
      ${Object.keys(settingCounts).length ? Object.entries(settingCounts).sort((a,b)=>b[1]-a[1]).map(([s,c]) => `
        <div class="bar-row">
          <div class="b-label">${escapeHtml(s)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c/maxSettingCount)*100}%; background:var(--signal)"></div></div>
          <div class="b-num">${c}</div>
        </div>
      `).join("") : `<p style="color:var(--muted); font-size:13.5px;">No entries yet.</p>`}
    </div>
  `;
}

/* ============================================================================
   BOOT
   ============================================================================ */
async function boot() {
  render(); // paint shell immediately (with empty state) while data loads
  await Data.loadAll();
  render();
}
boot();
</script>
</body>
</html>
